name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build AutoHDR
        run: dotnet build AutoHDR/AutoHDR.csproj -c Release

      - name: Build installer
        run: wix build AutoHDR.Installer/Package.wxs -arch x64 -o AutoHDR-1.1.0.msi -ext WixToolset.UI.wixext

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _release -Force
          $files = @(
            "AutoHDR/bin/Release/net48/AutoHDR.exe",
            "AutoHDR/bin/Release/net48/AutoHDR.exe.config",
            "AutoHDR/bin/Release/net48/known_games.txt",
            "AutoHDR/bin/Release/net48/store_game_publishers.txt"
          )
          Compress-Archive -Path $files -DestinationPath _release/AutoHDR-1.1.0-portable.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoHDR-Release
          path: |
            AutoHDR-1.1.0.msi
            _release/AutoHDR-1.1.0-portable.zip
